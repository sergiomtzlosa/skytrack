name: SkyTrack
options:
  bundleIdPrefix: com.skytrack
  deploymentTarget:
    macOS: "12.0"
  createIntermediateGroups: true

settings:
  base:
    CLANG_ENABLE_OBJC_ARC: YES
    MACOSX_DEPLOYMENT_TARGET: "12.0"
    SDKROOT: macosx
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: "-"
    DEVELOPMENT_TEAM: ""
    ENABLE_HARDENED_RUNTIME: NO

targets:
  SkyTrack:
    type: application
    platform: macOS
    sources:
      - path: SkyTrack
        excludes:
          - Info.plist
    settings:
      base:
        INFOPLIST_FILE: SkyTrack/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        PRODUCT_BUNDLE_IDENTIFIER: com.skytrack.app
        PRODUCT_NAME: SkyTrack
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        COMBINE_HIDPI_IMAGES: YES
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/../Frameworks"
    dependencies:
      - sdk: Cocoa.framework
      - sdk: WebKit.framework
      - sdk: CoreLocation.framework
      - sdk: SceneKit.framework
      - sdk: MapKit.framework

schemes:
  SkyTrack:
    build:
      targets:
        SkyTrack: all
    run:
      config: Debug
    archive:
      config: Release
